name: Build APK Nativo
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Poner tu icono chulo como icono nativo
        run: |
          ICON="www/icon-512.png"
          if [ ! -f "$ICON" ]; then ICON="www/icon-192.png"; fi
          echo "Usando $ICON como icono nativo"
          for d in android/app/src/main/res/mipmap-*; do
            cp "$ICON" "$d/ic_launcher.png"
            cp "$ICON" "$d/ic_launcher_round.png"
            if [ -f "$d/ic_launcher_foreground.png" ]; then
              cp "$ICON" "$d/ic_launcher_foreground.png"
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Casino-Pro-Nativo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
